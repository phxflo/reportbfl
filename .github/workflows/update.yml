name: Seil-Report aktualisieren

on:
  schedule:
    - cron: "30 5 * * *"      # täglich 05:30 UTC = 06:30 (Winter) / 07:30 (Sommer) deutscher Zeit
  workflow_dispatch:           # manueller Start über den Reiter "Actions"
    inputs:
      rejudge:
        description: "Alle Meldungen neu von Claude beurteilen (kostet deutlich mehr)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: read

concurrency:
  group: update-2           # neue Warteschlange (ein hängender Lauf in der alten blockierte alles)
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Passwort prüfen
        run: |
          if [ "${#PAGE_PASSWORD}" -lt 12 ]; then
            echo "::error::Secret PAGE_PASSWORD fehlt oder ist kürzer als 12 Zeichen. Es wird nichts veröffentlicht."
            exit 1
          fi
      - run: pip install -r requirements.txt
      - name: Archiv entschlüsseln
        run: |
          if [ -f data/news.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in data/news.enc -out data/news.json -pass env:PAGE_PASSWORD 2>/dev/null || true
            # Bei falschem Passwort entsteht Datenmüll: dann mit leerem Archiv neu beginnen
            python -c "import json; json.load(open('data/news.json', encoding='utf-8'))" 2>/dev/null \
              || { echo "::warning::Archiv nicht lesbar (Passwort geändert?) - starte mit leerem Archiv"; rm -f data/news.json; }
          fi
      - name: Ampel-Bewertungen laden
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_ratings.py
      - name: Meldungen abrufen
        env:
          COMPETITORS: ${{ secrets.COMPETITORS }}                # optional: Wettbewerber, durch Komma getrennt
          CUSTOMERS: ${{ secrets.CUSTOMERS }}                    # optional: Kunden, durch Komma getrennt
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}     # nur als Schalter: mit Claude dürfen weite Suchen ungefiltert durch
        run: python fetch_news.py
      - name: Kennzahlen abrufen (Destatis)
        env:
          DESTATIS_USER: ${{ secrets.DESTATIS_USER }}
          DESTATIS_PASSWORD: ${{ secrets.DESTATIS_PASSWORD }}
        run: python fetch_indices.py
      - name: Meldungen von Claude beurteilen lassen
        continue-on-error: true       # ohne Schlüssel oder bei API-Fehlern läuft der Report mit den Regeln weiter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPETITORS: ${{ secrets.COMPETITORS }}
          CUSTOMERS: ${{ secrets.CUSTOMERS }}
          AI_REJUDGE: ${{ github.event.inputs.rejudge }}
        run: python ai.py
      - name: Seite bauen
        env:
          CUSTOMERS: ${{ secrets.CUSTOMERS }}
        run: python build.py
      - name: Seite verschlüsseln
        run: python protect.py
      - name: Archiv verschlüsseln
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in data/news.json -out data/news.enc -pass env:PAGE_PASSWORD
          rm -f data/news.json
      - name: Änderungen speichern
        run: |
          git config user.name "seil-report-bot"
          git config user.email "bot@users.noreply.github.com"
          git rm -q --cached data/news.json 2>/dev/null || true
          git add .gitignore data docs
          git diff --staged --quiet || git commit -m "Update $(date -u +%F)"
          for n in 1 2 3; do git push && break; git pull --rebase -X theirs origin main || git rebase --abort; sleep 5; done
