# ─────────────────────────────────────────────────────────────
#  Der Seil-Report – Konfiguration
#  Hier änderst du Themen, Suchbegriffe und Länder. Kein Code nötig.
# ─────────────────────────────────────────────────────────────
site:
  title: "Der Seil-Report"
  tagline: "Marktbeobachtung für Industrie-Stahlseile · Export & Regionalvertrieb"
  retention_days: 21        # so lange bleiben Meldungen im Archiv
  window_days: 7            # Zeitraum der Anzeige ("Woche")
  fetch_days: 7             # pro Lauf: Meldungen der letzten n Tage abfragen
  per_section: 10           # höchstens so viele Meldungen je Rubrik (neueste zuerst, ältere fallen weg)
  top_n: 5                  # Top-News der Woche
  timezone: "Europe/Berlin"
  translate_max: 150        # höchstens so viele Titel pro Lauf übersetzen (nur sichtbare)

# Meldungen mit diesen Wörtern im Titel werden verworfen
exclude:
  - Manitowoc County
  - Manitowoc, Wis
  - Sheriff
  - Meth
  - Horoskop
  - Gewinnspiel
  - Klettersteig
  - Seilbahn
  - Hängebrücke
  - Fußball
  - cable car
  - zipline
  - مصر
  - Egypt
  - Ägypten
  - Égypte

# Treffer mit diesen Wörtern rutschen in "Top-News" weiter nach oben (Regex, ohne Groß/Klein)
boost: "zuschlag|surcharge|toeslag|supplément|ek ücret|zoll|zölle|tariff|tarif|droits de douane|gümrük|safeguard|cbam|sanktion|sanction|embargo|insolvenz|bankrupt|übernahme|acquisition|acquires|tadano|manitowoc|terex|potain|teufelberger|bridon|wireco|pfeifer|drahtseil|casar (drahtseil|wire)|liebherr (kran|crane|mobil)|wire rope|stahlseil|çelik halat|câble"

# Diese Wörter füllen den Kasten "Zuschlags-Radar"
radar: "zuschlag|surcharge|toeslag|legierung|alloy|rohstoff|safeguard|cbam|walzdraht|wire rod|filmaşin|fil machine|walsdraad|stahlpreis|steel price|çelik fiyat"

# Gewicht je Rubrik für die Top-News (1.0 = normal)
rubrics:
  - id: haefen
    title: "Häfen, Terminals & Güterumschlag"
    short: "Häfen"
    weight: 1.0
    core: 'ship-to-shore|sts[- ]crane|(?<!\w)(rtg|rmg)(?!\w)|kaikran|hafenkran|quay crane|containerbrücke|container ?terminal|terminal à conteneurs|konteyner terminal|havenkraan|kadekraan|محطة حاويات|מסוף מכולות'   # Treffer hier zählen auch ohne Ereigniswort
    must: 'hafen|häfen|kaianlage|kaikran|umschlag|container ?terminal|konteyner terminal|terminal à conteneurs|quay|(?<!\w)ports?(?!\w)|ship-to-shore|(?<!\w)(rtg|rmg|sts)(?!\w)|haven|(?<!\w)kade|liman|ميناء|موانئ|محطة حاويات|נמל|מסוף מכולות'   # Titel muss eines dieser Stichwörter enthalten (Regex)
    terms:
      de: [Hafenkran, Containerterminal, Hafenausbau, Kaianlage, Terminal Umschlag, Hafen Investition]
      en: ["container terminal", "port expansion", "ship-to-shore crane", "quay crane", "port investment", "RTG crane"]
      fr: ["terminal à conteneurs", "extension du port", "grue de quai", "port investissement"]
      nl: [containerterminal, havenuitbreiding, kadekraan, haven investering]
      tr: ["konteyner terminali", "liman yatırımı", "liman vinci", "liman genişletme"]
      ar: ["محطة حاويات", "توسعة ميناء", "رافعة ميناء"]
      he: ["מסוף מכולות", "הרחבת נמל", "מנוף נמל"]

  - id: kraene
    title: "Kranflotten – Turmdreh-, Mobil- & Raupenkrane"
    short: "Krane"
    weight: 0.9
    core: 'crane (collapse|accident|fire|topples?|overturn\w*)|kraneinsturz|kranunfall|kran (stürzt|kippt|umgestürzt)|grue (tombe|effondr\w*)|vinç (devril\w*|kaza\w*)|kraan (omgevallen|ongeval)|tadano|(manitowoc|terex|liebherr|potain)[^.]{0,40}(kran|crane|grue|vinç|kraan)|crane (fleet|rental)|kranvermiet|kranflotte|parc de grues|vinç filosu|kraanverhuur'   # Treffer hier zählen auch ohne Ereigniswort
    must: 'kran(e|en)?(?!\w)|crane|grue|kraan|kranen|vinç|(liebherr|tadano|manitowoc|terex|potain)[^.]{0,60}(kran|crane|grue|vinç|kraan)|(kran|crane|grue|vinç|kraan)[^.]{0,60}(liebherr|tadano|manitowoc|terex|potain)|raupenkran|crawler crane|رافعة|رافعات|עגורן|מנוף'   # Titel muss eines dieser Stichwörter enthalten (Regex)
    terms:
      de: [Turmdrehkran, Mobilkran, Raupenkran, Kranflotte, Autokran, "Liebherr Mobilkran"]
      en: ["tower crane", "mobile crane", "crawler crane", "crane fleet", "Tadano", "Manitowoc"]
      fr: ["grue à tour", "grue mobile", "grue sur chenilles", "parc de grues"]
      nl: [torenkraan, "mobiele kraan", rupskraan, kraanverhuur]
      tr: ["kule vinç", "mobil vinç", "paletli vinç", "vinç filosu"]
      ar: ["رافعة برجية", "رافعة متحركة", "رافعة زاحفة"]
      he: ["עגורן צריח", "מנוף נייד", "מנוף זחלי"]

  - id: industrie
    title: "Industrie – Stahlwerke, Schwerindustrie & Prozesskrane"
    short: "Industrie"
    weight: 0.8
    core: 'stahlwerk|steel ?(mill|works|plant)|aci[eé]rie|hochofen|blast furnace|lichtbogenofen|electric arc furnace|staalfabriek|çelik fabrikası|demir çelik (fabrika|tesis)\w*|brückenkran|overhead crane|prozesskran|pont roulant|brugkraan'   # Treffer hier zählen auch ohne Ereigniswort
    must: 'stahl|steel|hütte|schwerindustrie|heavy industry|aci[eé]rie|sid[eé]rurgie|industrie lourde|staal|zware industrie|çelik|demir|صلب|فولاذ|صناعة ثقيلة|פלדה|תעשייה כבדה|pont roulant|brückenkran|overhead crane|prozesskran'   # Titel muss eines dieser Stichwörter enthalten (Regex)
    terms:
      de: [Stahlwerk, Schwerindustrie, Brückenkran, Hüttenwerk, "Stahlindustrie Investition"]
      en: ["steel mill", "heavy industry", "overhead crane", "steelworks investment", "process crane"]
      fr: [aciérie, "industrie lourde", "pont roulant", sidérurgie]
      nl: [staalfabriek, "zware industrie", brugkraan]
      tr: ["çelik fabrikası", "ağır sanayi", "köprülü vinç", "demir çelik"]
      ar: ["مصنع صلب", "صناعة ثقيلة", "رافعة جسرية"]
      he: ["מפעל פלדה", "תעשייה כבדה", "עגורן גשר"]

  - id: tiefbau
    title: "Spezialtiefbau – Bohrgeräte, Seilbagger & Schlitzwandgreifer"
    short: "Spezialtiefbau"
    weight: 0.7
    core: 'schlitzwand|diaphragm wall|bohrgerät|seilbagger|drilling rig|piling rig|paroi moulée|diepwand|spezialtiefbau|deep foundation|bauer (maschinen|spezialtiefbau|group)|soilmec'   # Treffer hier zählen auch ohne Ereigniswort
    must: 'tiefbau|schlitzwand|bohrgerät|bohrpfahl|bohranlage|bohrtechnik|seilbagger|diaphragm wall|deep foundation|foundation (work|engineering|piling)|piling|(?<!\w)piles?(?!\w)|drilling rig|excavator|soilmec|bauer (group|maschinen|spezialtiefbau)|paroi moulée|fondations? spécial|foreuse|diepwand|funderingstechniek|boormachine|diyafram duvar|özel temel|kazık|sondaj|حفار|أساسات|جدار ساتر|כלונס|יסודות עמוקים'   # Titel muss eines dieser Stichwörter enthalten (Regex)
    terms:
      de: [Spezialtiefbau, Schlitzwandgreifer, Bohrgerät, Seilbagger, "Tiefbau Großprojekt"]
      en: ["diaphragm wall", "deep foundation", "piling rig", "cable excavator", "Bauer Maschinen", "Soilmec"]
      fr: ["paroi moulée", "fondations spéciales", foreuse, "pelle à câble"]
      nl: [diepwand, funderingstechniek, boormachine]
      tr: ["diyafram duvar", "özel temel", "sondaj makinesi", "fore kazık"]
      ar: ["جدار ساتر", "أساسات عميقة", "حفارة"]
      he: ["כלונסאות", "יסודות עמוקים"]

  - id: laender
    title: "Länder – Zölle, Handel, Konjunktur & Logistik"
    short: "Länder"
    weight: 0.8
    must: 'zoll|zölle|strafzoll|tarif|customs|(?<!\w)dut(y|ies)(?!\w)|douane|gümrük|sanktion|sanction|yaptırım|embargo|antidumping|anti-dumping|quota|kontingent|importverbot|import ban|export ban|exportverbot|einfuhr(verbot|beschränk\w*|quote)|invoerrechten|safeguard|schutzmaßnahme\w*|cbam|devisen|currency control|capital control|hafenstreik|port strike|dockers? strike|port closure|blockade|handelsabkommen|trade (deal|agreement|war)|importbeschränk\w*|restrictions? on (steel|imports?)|ihracat yasağı|ithalat|جمارك|عقوبات|حظر|מכס|סנקציות|אמברגו'   # Länder: nur Handels-/Sanktions-/Zollthemen
    terms: {}                # Länder-Suchen stehen unten unter "countries"

  - id: rohstoffe
    title: "Rohstoffe & Zuschläge"
    short: "Rohstoffe"
    weight: 1.0
    core: 'zuschlag|surcharge|toeslag|supplément|walzdraht|wire rod|walsdraad|filmaşin|fil machine|cbam|safeguard|schutzmaßnahmen|stahlpreis|steel price|prix de l.acier|staalprijs|çelik fiyat'   # Treffer hier zählen auch ohne Ereigniswort
    must: 'zuschlag|surcharge|toeslag|legierung|alloy|walzdraht|wire rod|fil machine|walsdraad|filmaşin|stahlpreis|steel price|scrap|schrott|schroot|hurda|zink|zinc|nickel|cbam|safeguard|schutzmaßnahmen|prix de l.acier|prix du fil|staalprijs|çelik fiyat|ek ücret|supplément|מחירי פלדה|מחיר ברזל'   # Titel muss eines dieser Stichwörter enthalten (Regex)
    terms:
      de: [Legierungszuschlag, Rohstoffzuschlag, Walzdraht, Stahlpreise, Schrottpreis, "CBAM Stahl", Zinkpreis]
      en: ["wire rod price", "steel price", "scrap price", "CBAM steel", "EU steel safeguard", "zinc price", "nickel price"]
      fr: ["prix du fil machine", "prix de l'acier", "CBAM acier"]
      nl: [staalprijs, walsdraad, schrootprijs]
      tr: ["filmaşin fiyat", "çelik fiyatları", "hurda fiyatları"]
      he: ["מחירי פלדה", "מחיר ברזל"]

  - id: markt
    title: "Markt & Wettbewerb – Stahlseile"
    short: "Markt"
    weight: 0.9
    must: 'seilhersteller|drahtseil|stahlseil|wire rope|steel wire|câbles? en acier|câbles? métalliques?|câbles? d.acier|staalkabel|staaldraad|çelik halat|halat|حبال فولاذية|كابلات فولاذية|כבלי פלדה|חבל פלדה|bridon|wireco|teufelberger|pfeifer|casar[^.]{0,50}(seil|wire|rope|cable|câble|cables|kabel|halat|حبال|كابلات|כבל|חבל)|(seil|wire|rope|cable|câble|cables|kabel|halat|حبال|كابلات|כבל|חבל)[^.]{0,50}casar'   # Titel muss eines dieser Stichwörter enthalten (Regex)
    terms:
      de: [Drahtseil, Stahlseil, Seilhersteller, Teufelberger, "Casar Drahtseilwerk", "PFEIFER Seil"]
      en: ["wire rope", "steel wire rope", "Bridon-Bekaert", WireCo, Teufelberger, "Casar wire rope"]
      fr: ["câble en acier", "câble métallique", "câbles d'acier"]
      nl: [staalkabel, staaldraadkabel]
      tr: ["çelik halat", "halat üreticisi"]
      ar: ["حبال فولاذية", "كابلات فولاذية"]
      he: ["כבלי פלדה", "חבל פלדה"]

