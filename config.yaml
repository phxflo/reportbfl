ai:                       # Auswertung durch Claude (nur mit Secret ANTHROPIC_API_KEY); ohne Schlüssel gelten die Regeln oben
  model: claude-sonnet-5-5   # Relevanzentscheidung (Qualität zählt)
  cheap_model: claude-haiku-5-5   # nur Übersetzen (Haiku fand beim Gruppieren keine Vorfälle)
  group_min_new: 5        # Gruppierung nur ab so vielen neu beurteilten Meldungen
  block_source_red: 4     # Quelle gesperrt, wenn so oft rot und nie grün bewertet
  batch: 25               # Meldungen je Anfrage
  max_items: 150          # Obergrenze neuer Meldungen je Lauf (Kostenbremse); der Rest folgt am nächsten Tag

research:                 # Hintergrundrecherche mit Kurzbericht (Web-Suche durch Claude) für Top 5, Kunden und Wettbewerber
  model: claude-haiku-5-5   # Haiku: Berichte zu allen angezeigten Meldungen bleiben bezahlbar
  max_per_run: 40          # höchstens so viele neue Berichte je Lauf (Kostenbremse, ca. 0,04 $ je Bericht)
  searches: 1             # Web-Suchen je Bericht (jede Suche liefert viel Text und kostet Eingabe-Token)

