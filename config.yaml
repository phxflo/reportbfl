# ─────────────────────────────────────────────────────────────
#  Der Seil-Report – Konfiguration
#  Hier änderst du Themen, Suchbegriffe und Länder. Kein Code nötig.
# ─────────────────────────────────────────────────────────────
site:
  title: "Der Seil-Report"
  tagline: "Marktbeobachtung für Industrie-Stahlseile · Export & Regionalvertrieb"
  retention_days: 21        # so lange bleiben Meldungen im Archiv
  window_days: 7            # Zeitraum der Anzeige ("Woche")
  fetch_days: 7             # pro Lauf: Meldungen der letzten n Tage abfragen
  per_section: 10           # höchstens so viele Meldungen je Rubrik (neueste zuerst, ältere fallen weg)
  top_n: 5                  # Top-News der Woche
  timezone: "Europe/Berlin"
  translate_max: 150        # höchstens so viele Titel pro Lauf übersetzen (nur sichtbare)

# Meldungen mit diesen Wörtern im Titel werden verworfen
exclude:
  - Horoskop
  - Gewinnspiel
  - Klettersteig
  - Seilbahn
  - Hängebrücke
  - Fußball
  - cable car
  - zipline
  - مصر
  - Egypt
  - Ägypten
  - Égypte

# Treffer mit diesen Wörtern rutschen in "Top-News" weiter nach oben (Regex, ohne Groß/Klein)
boost: "zuschlag|surcharge|toeslag|supplément|ek ücret|zoll|zölle|tariff|tarif|droits de douane|gümrük|safeguard|cbam|sanktion|sanction|embargo|insolvenz|bankrupt|übernahme|acquisition|acquires|liebherr|bauer|tadano|manitowoc|terex|potain|casar|teufelberger|bridon|wireco|pfeifer|drahtseil|wire rope|stahlseil|çelik halat|câble"

# Diese Wörter füllen den Kasten "Zuschlags-Radar"
radar: "zuschlag|surcharge|toeslag|legierung|alloy|rohstoff|safeguard|cbam|walzdraht|wire rod|filmaşin|fil machine|walsdraad|stahlpreis|steel price|çelik fiyat"

# Gewicht je Rubrik für die Top-News (1.0 = normal)
rubrics:
  - id: haefen
    title: "Häfen, Terminals & Güterumschlag"
    short: "Häfen"
    weight: 1.0
    must: 'hafen|häfen|terminal|kaianlage|kaikran|umschlag|container|quay|(?<!\w)ports?(?!\w)|ship-to-shore|(?<!\w)(rtg|rmg|sts)(?!\w)|haven|(?<!\w)kade|liman|konteyner|ميناء|موانئ|محطة|حاويات|נמל|מסוף|מכולות'   # Titel muss eines dieser Stichwörter enthalten (Regex)
    terms:
      de: [Hafenkran, Containerterminal, Hafenausbau, Kaianlage, Terminal Umschlag, Hafen Investition]
      en: ["container terminal", "port expansion", "ship-to-shore crane", "quay crane", "port investment", "RTG crane"]
      fr: ["terminal à conteneurs", "extension du port", "grue de quai", "port investissement"]
      nl: [containerterminal, havenuitbreiding, kadekraan, haven investering]
      tr: ["konteyner terminali", "liman yatırımı", "liman vinci", "liman genişletme"]
      ar: ["محطة حاويات", "توسعة ميناء", "رافعة ميناء"]
      he: ["מסוף מכולות", "הרחבת נמל", "מנוף נמל"]

  - id: kraene
    title: "Kranflotten – Turmdreh-, Mobil- & Raupenkrane"
    short: "Krane"
    weight: 0.9
    must: 'kran(e|en)?(?!\w)|crane|grue|kraan|kranen|vinç|liebherr|tadano|manitowoc|terex|potain|raupen|crawler|رافعة|رافعات|עגורן|מנוף'   # Titel muss eines dieser Stichwörter enthalten (Regex)
    terms:
      de: [Turmdrehkran, Mobilkran, Raupenkran, Kranflotte, Autokran, Liebherr Kran]
      en: ["tower crane", "mobile crane", "crawler crane", "crane fleet", "Tadano", "Manitowoc"]
      fr: ["grue à tour", "grue mobile", "grue sur chenilles", "parc de grues"]
      nl: [torenkraan, "mobiele kraan", rupskraan, kraanverhuur]
      tr: ["kule vinç", "mobil vinç", "paletli vinç", "vinç filosu"]
      ar: ["رافعة برجية", "رافعة متحركة", "رافعة زاحفة"]
      he: ["עגורן צריח", "מנוף נייד", "מנוף זחלי"]

  - id: industrie
    title: "Industrie – Stahlwerke, Schwerindustrie & Prozesskrane"
    short: "Industrie"
    weight: 0.8
    must: 'stahl|steel|hütte|schwerindustrie|heavy industry|aci[eé]rie|sid[eé]rurgie|industrie lourde|staal|zware industrie|çelik|demir|صلب|فولاذ|صناعة ثقيلة|פלדה|תעשייה כבדה|pont roulant|brückenkran|overhead crane|prozesskran'   # Titel muss eines dieser Stichwörter enthalten (Regex)
    terms:
      de: [Stahlwerk, Schwerindustrie, Brückenkran, Hüttenwerk, "Stahlindustrie Investition"]
      en: ["steel mill", "heavy industry", "overhead crane", "steelworks investment", "process crane"]
      fr: [aciérie, "industrie lourde", "pont roulant", sidérurgie]
      nl: [staalfabriek, "zware industrie", brugkraan]
      tr: ["çelik fabrikası", "ağır sanayi", "köprülü vinç", "demir çelik"]
      ar: ["مصنع صلب", "صناعة ثقيلة", "رافعة جسرية"]
      he: ["מפעל פלדה", "תעשייה כבדה", "עגורן גשר"]

  - id: tiefbau
    title: "Spezialtiefbau – Bohrgeräte, Seilbagger & Schlitzwandgreifer"
    short: "Spezialtiefbau"
    weight: 0.7
    must: 'tiefbau|schlitzwand|bohr|seilbagger|diaphragm|foundation|piling|(?<!\w)piles?(?!\w)|drill|excavator|soilmec|bauer|paroi|fondation|foreuse|pelle|diepwand|fundering|boor|diyafram|temel|kazık|sondaj|حفار|أساسات|جدار|כלונס|יסוד'   # Titel muss eines dieser Stichwörter enthalten (Regex)
    terms:
      de: [Spezialtiefbau, Schlitzwandgreifer, Bohrgerät, Seilbagger, "Tiefbau Großprojekt"]
      en: ["diaphragm wall", "deep foundation", "piling rig", "cable excavator", "Bauer Group", "Soilmec"]
      fr: ["paroi moulée", "fondations spéciales", foreuse, "pelle à câble"]
      nl: [diepwand, funderingstechniek, boormachine]
      tr: ["diyafram duvar", "özel temel", "sondaj makinesi", "fore kazık"]
      ar: ["جدار ساتر", "أساسات عميقة", "حفارة"]
      he: ["כלונסאות", "יסודות עמוקים"]

  - id: laender
    title: "Länder – Zölle, Handel, Konjunktur & Logistik"
    short: "Länder"
    weight: 0.8
    must: 'zoll|zölle|handel|tarif|customs|(?<!\w)dut(y|ies)(?!\w)|douane|gümrük|sanktion|sanction|embargo|import|export|ihracat|ithalat|hafen|häfen|(?<!\w)ports?(?!\w)|haven|liman|logist|lojistik|stahl|steel|staal|acier|çelik|lira|dirham|dinar|währung|currency|devise|جمارك|استيراد|تصدير|ميناء|موانئ|صلب|فولاذ|لوجست|מכס|יבוא|יצוא|נמל|פלדה|לוגיסטיקה|invoerrechten|grève|streik|strike'   # Titel muss eines dieser Stichwörter enthalten (Regex)
    terms: {}                # Länder-Suchen stehen unten unter "countries"

  - id: rohstoffe
    title: "Rohstoffe & Zuschläge"
    short: "Rohstoffe"
    weight: 1.0
    must: 'zuschlag|surcharge|toeslag|legierung|alloy|walzdraht|wire rod|fil machine|walsdraad|filmaşin|stahlpreis|steel price|scrap|schrott|schroot|hurda|zink|zinc|nickel|cbam|safeguard|schutzmaßnahmen|prix de l.acier|prix du fil|staalprijs|çelik fiyat|ek ücret|supplément|מחירי פלדה|מחיר ברזל'   # Titel muss eines dieser Stichwörter enthalten (Regex)
    terms:
      de: [Legierungszuschlag, Rohstoffzuschlag, Walzdraht, Stahlpreise, Schrottpreis, "CBAM Stahl", Zinkpreis]
      en: ["wire rod price", "steel price", "scrap price", "CBAM steel", "EU steel safeguard", "zinc price", "nickel price"]
      fr: ["prix du fil machine", "prix de l'acier", "CBAM acier"]
      nl: [staalprijs, walsdraad, schrootprijs]
      tr: ["filmaşin fiyat", "çelik fiyatları", "hurda fiyatları"]
      he: ["מחירי פלדה", "מחיר ברזל"]

  - id: markt
    title: "Markt & Wettbewerb – Stahlseile"
    short: "Markt"
    weight: 0.9
    must: 'seil|wire rope|steel wire|rope|câbles? en acier|câbles? métalliques?|câbles? d.acier|staalkabel|staaldraad|halat|حبال|كابلات فولاذية|כבלי פלדה|חבל|bridon|wireco|teufelberger|casar|pfeifer'   # Titel muss eines dieser Stichwörter enthalten (Regex)
    terms:
      de: [Drahtseil, Stahlseil, Seilhersteller, Teufelberger, Casar, "PFEIFER Seil"]
      en: ["wire rope", "steel wire rope", "Bridon-Bekaert", WireCo, Teufelberger, Casar]
      fr: ["câble en acier", "câble métallique", "câbles d'acier"]
      nl: [staalkabel, staaldraadkabel]
      tr: ["çelik halat", "halat üreticisi"]
      ar: ["حبال فولاذية", "كابلات فولاذية"]
      he: ["כבלי פלדה", "חבל פלדה"]

# Länder: je Ausgabe eine Suche in der Landessprache (nur Handel, Zoll, Stahl, Häfen, Logistik).
# names = Länder-, Städte- und Hafennamen. Ein Land wird einer Meldung nur zugeordnet, wenn einer dieser
# Namen in der Überschrift steht (also das Land, um das es geht – nicht das Land der Quelle).
countries:
  - id: BE
    name: Belgien
    names: ["Belgi", "بلجيك", "Antwerp", "Anvers", "Zeebrugge", "Gent", "Ghent", "Brüssel", "Brussel", "Bruxelles", "Liège", "Charleroi", "أنتويرب", "بروكسل", "Brugge", "Bruges"]
    editions:
      - {lang: nl, hl: nl, gl: BE, ceid: "BE:nl", q: "België (haven OR staal OR invoerrechten OR douane OR logistiek)"}
      - {lang: fr, hl: fr, gl: BE, ceid: "BE:fr", q: "Belgique (port OR acier OR douane OR logistique OR grève)"}
      - {lang: de, hl: de, gl: DE, ceid: "DE:de", q: "Belgien (Zoll OR Handelsbeschränkungen OR Hafen OR Stahl OR Logistik)"}
  - id: NL
    name: Niederlande
    names: ["Niederlande", "Niederländ", "Netherlands", "Nederland", "Pays-Bas", "Dutch", "Holland", "هولندا", "Rotterdam", "Amsterdam", "روتردام", "أمستردام", "Pays Bas"]
    editions:
      - {lang: nl, hl: nl, gl: NL, ceid: "NL:nl", q: "Nederland (haven OR staal OR invoerrechten OR douane OR logistiek)"}
      - {lang: de, hl: de, gl: DE, ceid: "DE:de", q: "Niederlande (Zoll OR Handelsbeschränkungen OR Hafen OR Stahl OR Logistik)"}
  - id: MA
