      - {lang: en, hl: en, gl: TR, ceid: "TR:en", q: "Turkey (steel OR port OR tariffs OR customs OR lira)"}
      - {lang: de, hl: de, gl: DE, ceid: "DE:de", q: "Türkei (Zoll OR Handelsbeschränkungen OR Hafen OR Stahl OR Logistik OR Lira)"}

# Google-News-Ausgaben für die Rubrik-Suchen je Sprache. Nur Ausgaben deiner Länder,
# damit z. B. arabische Suchen nicht Ägypten statt Marokko/Algerien/Tunesien liefern.
editions:
  de: [{hl: de, gl: DE, ceid: "DE:de"}]
  en: [{hl: en-US, gl: US, ceid: "US:en"}]
  fr: [{hl: fr, gl: MA, ceid: "MA:fr"}, {hl: fr, gl: DZ, ceid: "DZ:fr"}, {hl: fr, gl: TN, ceid: "TN:fr"}, {hl: fr, gl: BE, ceid: "BE:fr"}]
  nl: [{hl: nl, gl: NL, ceid: "NL:nl"}, {hl: nl, gl: BE, ceid: "BE:nl"}]
  tr: [{hl: tr, gl: TR, ceid: "TR:tr"}]
  ar: [{hl: ar, gl: MA, ceid: "MA:ar"}, {hl: ar, gl: DZ, ceid: "DZ:ar"}, {hl: ar, gl: TN, ceid: "TN:ar"}]
  he: [{hl: he, gl: IL, ceid: "IL:he"}]

# Zusätzliche feste RSS-Feeds (Fachportale). Format: {name, url, rubric, lang}
feeds: []
#  - {name: "Beispiel Fachportal", url: "https://example.com/rss.xml", rubric: kraene, lang: de}

# Kennzahlen (Destatis GENESIS-Online)
indices:
  - id: draht
    table: "61241-0004"
    title: "Erzeugerpreisindex – kaltgezogener Draht"
    sub: "GP19-2434 · Destatis · monatlich"
    freq: monthly
    require: ["GP19-2434"]
    url: "https://www-genesis.destatis.de/datenbank/online/table/61241-0004"
  - id: aki
    table: "62421-0001"
    title: "Arbeitskostenindex – Verarbeitendes Gewerbe"
    sub: "Destatis · quartalsweise"
    freq: quarterly
    require: ["WZ08-C", "WERTORG", "QMU"]
    url: "https://www-genesis.destatis.de/datenbank/online/table/62421-0001"
