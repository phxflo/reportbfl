  - {name: "World Cargo News", site: "worldcargonews.com", lang: en, rubric: kraene, q: "(crane OR heavy lift OR crawler OR mobile crane OR tower crane)"}
  - {name: "Port Technology", site: "porttechnology.org", lang: en, rubric: haefen, q: "(crane OR terminal OR equipment OR automation)"}
  - {name: "Splash247", site: "splash247.com", lang: en, rubric: haefen, q: "(port OR terminal OR crane OR strike OR tariff)"}
