      - {lang: ar, hl: ar, gl: MA, ceid: "MA:ar", q: "المغرب (ميناء OR صلب OR جمارك OR استيراد OR لوجستيك)"}
      - {lang: de, hl: de, gl: DE, ceid: "DE:de", q: "Marokko (Zoll OR Handelsbeschränkungen OR Hafen OR Stahl OR Logistik)"}
  - id: DZ
    name: Algerien
    names: ["Alger", "Algier", "Algér", "الجزائر", "وهران", "Oran", "Annaba", "Bejaia", "Béjaïa", "Djen Djen", "Skikda", "عنابة", "بجاية", "سكيكدة"]
    editions:
      - {lang: fr, hl: fr, gl: DZ, ceid: "DZ:fr", q: "Algérie (port OR acier OR douane OR importation OR logistique)"}
      - {lang: ar, hl: ar, gl: DZ, ceid: "DZ:ar", q: "الجزائر (ميناء OR صلب OR جمارك OR استيراد OR لوجستيك)"}
      - {lang: de, hl: de, gl: DE, ceid: "DE:de", q: "Algerien (Zoll OR Handelsbeschränkungen OR Hafen OR Stahl OR Logistik)"}
  - id: TN
    name: Tunesien
    names: ["Tunesi", "Tunis", "تونس", "Sfax", "Radès", "Bizerte", "Sousse", "Gabès", "صفاقس", "سوسة", "بنزرت", "رادس"]
    editions:
      - {lang: fr, hl: fr, gl: TN, ceid: "TN:fr", q: "Tunisie (port OR acier OR douane OR importation OR logistique)"}
      - {lang: ar, hl: ar, gl: TN, ceid: "TN:ar", q: "تونس (ميناء OR صلب OR جمارك OR استيراد OR لوجستيك)"}
      - {lang: de, hl: de, gl: DE, ceid: "DE:de", q: "Tunesien (Zoll OR Handelsbeschränkungen OR Hafen OR Stahl OR Logistik)"}
  - id: IL
    name: Israel
    names: ["Israel", "ישראל", "إسرائيل", "Haifa", "Ashdod", "Aschdod", "Eilat", "Tel Aviv", "אשדוד", "חיפה", "אילת", "תל אביב", "حيفا", "أشدود", "إيلات", "Israeli"]
    editions:
      - {lang: he, hl: he, gl: IL, ceid: "IL:he", q: "ישראל (נמל OR פלדה OR מכס OR יבוא OR לוגיסטיקה)"}
      - {lang: en, hl: en, gl: IL, ceid: "IL:en", q: "Israel (port OR steel OR customs OR import OR sanctions)"}
