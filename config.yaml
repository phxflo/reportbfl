# Ausschluss per Regex (Titel + Quelle + Textauszug): gleiche Namen / Wörter mit anderer Bedeutung
exclude_regex:
  # Länder: kein Lebensmittel-/Folklore-/Protest-Rauschen, keine Israel-Boykottpolitik
  - 'rinder|tomat|datteln|dattes|weichweizen|weizen|\bblé\b|wheat|fleisch|viande|\bmiel\b|honig|fromage|käse|schafe|moutons|zigarett|cigarettes|slimming|afslank|schlank|traditions|folklore|haredim|activist|protesters|marchen|demonstrat'
  - 'sanctions? (on|against) israel|israel must face sanctions|israel sanctions|sanktionen (gegen|wegen) israel|israel-sanktionen|measures against israel|sanctions (on|against) (israeli|ben-gvir)|aims sanctions at israel|blindés|military aircraft|armored vehicles?'
  - 'tupolev|sonderflüge|sanktionierte[rn]? (jet|flug)|sanktionierter jet'
  # weitere Fehltreffer (zweiter Lauf)
  - 'genocide|apartheid|corbyn|burnham|miliband|israeli communities|settlements?\b|palestin|gaza flooding|attorneys? general|attorney generals|generalstaatsanw|\bAGs\b|raz-de-marée|midterm'
  - 'vision ai|bioengineer|coingecko|live price chart|market cap|\btsxv?\b|kalkine|marketscreener|earnings (results|call)|jagdpächter|jagd\b|wilddieb'
  # Fehltreffer aus echten Läufen
  - 'greg casar|rep\.? casar|casar[^.]{0,80}(congress|democrat|ice agent|texas|austin|progressive)|congress(man|woman)?\b|data breach|claim depot|class action|lawsuit investigation'
  - 'cranes? (trophies|trophy)|atatürk|ataturk|zinkmine|zinc mine|erkundungsbohr|explorationsbohr|akkuschrauber|batteriebohrer|schlagbohrer|bohrmaschine (test|angebot)|offshore|ölbohr|oil rig|oil and gas|beach soccer|hijab|kopftuch|tabak|tobacco'
  # Markennamen nur mit Kran-/Seil-Zusammenhang: ohne ein Hebezeug-Wort im Titel/Text fliegt die Meldung raus
  - '^(?!.*(crane|kran|grue|kraan|vinç|lift|hoist|hebe|wire rope|seil)).*(manitowoc|potain|tadano|terex|liebherr|grove\b)'
  # Namensvettern, Lokales, Börsen-Tipps
  - 'sheboygan|two rivers|herald times|lakeshore|stop sign|family market|football season|\bbulls\b|\bbears\b|99% rally'
  - '\b(stock|stocks|shares|bullish|bearish|rally|price target|nyse|nasdaq)\b|aktie|kursziel|dividende'
  # Namensvettern von Kran- und Seilfirmen
  - 'manitowoc[ ,]+(county|wis|wi\b|wisconsin|public|police|sheriff)'
  - 'liebherr[- ]?(kühl|gefrier|hausger|fridge|freezer|refriger)|kühlschr|kühl-? ?gefrier'
  - 'casar de |ana casar|casar (de )?cáceres|cáceres|casar de palomero'
  - 'bauer (media|verlag|sucht|radio|digital)|bauer sucht frau|landwirt|\bernte\b|bauernverband|\bbauern\b'
  - 'terex (cup|the cat)'
  # "Kran/crane" im Sinne von Vogel, Namen, Kultur
  - 'whooping crane|sandhill crane|crane fly|crane kick|karate kid|origami|kranich|kraniche|grue cendr|kraanvogel|vogelzug|bird flu|vogelgrippe'
  - '\b(tom|jane|ian|ben|bob|stephen|david|jim|rob|sam) crane\b|crane (county|township|elementary|high school|hotel|nxt|currency)|stephen crane'
  # "Hafen/port/haven" im Sinne von Flughafen, Anschluss, Zuflucht, Steuer
  - 'flughafen|airport|aéroport|aeroport|luchthaven|vliegveld|havalimanı|airline|fluglinie|fluggast'
  - 'safe haven|tax haven|steueroase|steuerparadies|havenwood|\busb\b|\bhdmi\b|ethernet|port forward|port scan|passport|portfolio|port-au-prince|port said|port sudan|port harcourt|portland'
  - 'port(ugal|o\b)|quay(s)? (road|street|hotel)|key west|kade (grup|bahçe)'
  # Lifestyle, Sport, Kriminalität, Boulevard
  - 'sheriff|obituar|nachruf|killed in crash|shooting|schießerei|\bmeth\b|methamphet|dui\b|arrested for|verhaftet nach|festgenommen nach|mordprozess|murder trial'
  - '\b(nfl|nba|nhl|mlb|premier league|bundesliga|champions league|ligue 1|tennis|formel 1|formula 1|fußball|football match|rezept|recipe|horoskop|promis?|celebrity|netflix|spotify|iphone|android|playstation|xbox|bitcoin|krypto\w*)\b'
  - 'hochzeit|wedding|babyshower|gewinnspiel|giveaway|lottery|lotto'
  - '(fahrplan\w*|schedule|horaires?|timetable|dienstregeling)[^.]{0,50}(fähr\w*|ferry|ferries|traversée|veer\w*)|(fähr\w*|ferry|ferries|traversée|veer\w*)[^.]{0,50}(fahrplan\w*|schedule|horaires?|timetable|passagier\w*|passenger|tourist\w*|kreuzfahrt|cruise)'   # Passagierfähren

