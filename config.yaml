  - id: projekte
    title: "Projekte & Ausschreibungen – künftiger Seilbedarf"
    group: "Zielmärkte"
    short: "Projekte"
    weight: 0.9
    must: 'ausschreibung|vergabe|auftrag|bestellung|projekt|ausbau|erweiterung|neubau|investition|tender|contract|order|project|expansion|investment|development|appel d.offres|marché|commande|projet|extension|investissement|aanbesteding|opdracht|bestelling|uitbreiding|ihale|sipariş|proje|yatırım|genişlet'
